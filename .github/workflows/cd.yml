name: Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  workflow_dispatch: {}

# ---------------------------------------------------------
# Global configuration
# ---------------------------------------------------------
env:
  # Docker image names
  BACKEND_IMAGE_NAME: "ecg-backend"
  FRONTEND_IMAGE_NAME: "ecg-frontend"
  # Docker registry (GitHub Container Registry)
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # Image tagging
  DEFAULT_TAG: "latest"
  GITHUB_SHA: "${{ github.sha }}"

jobs:
  # ---------------------------------------------------------
  # Step 1: Build and Push Docker Images
  # ---------------------------------------------------------
  build-and-push:
    name: Build & Push Multi-Arch Docker Images
    runs-on: ubuntu-latest
    timeout-hours: 4
    needs: [test-backend-ml, test-frontend]
    if: success()  # Only deploy if all CI checks pass
    outputs:
      backend-image: ${{ steps.set-outputs.outputs.backend-image }}
      frontend-image: ${{ steps.set-outputs.outputs.frontend-image }}

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Cache Docker layers
        uses: actions/cache@v4
        with:
          key: docker-layers-${{ runner.os }}-${{ hashFiles('packages/backend/Dockerfile', 'packages/frontend/Dockerfile') }}
          restore-keys: |
            docker-layers-${{ runner.os }}-
          paths:
            "**/.docker-cache/**"

      - name: 🔨 Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/backend
          file: ./packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}-github:${{ env.GITHUB_SHA }}
          # Platforms: amd64 and arm64 for broad compatibility
          platforms: |
            linux/amd64
            linux/arm64
          # Build cache_from and cache_to for faster incremental builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:cache,type=cache
          # Add build args for build-time environment variables
          build-args: |
            SAMPLING_RATE=360
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

      - name: 🔨 Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/frontend
          file: ./packages/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}-${{ env.DEFAULT_TAG }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}-github:${{ env.GITHUB_SHA }}
          # Platforms: amd64 and arm64
          platforms: |
            linux/amd64
            linux/arm64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:cache,type=cache
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

      - name: 🏷️ Set deployment output variables
        id: set-outputs
        run: |
          echo "backend-image=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" >> $GITHUB_OUTPUT
          echo "frontend-image=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}-${{ env.DEFAULT_TAG }}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------
  # Step 2: Deploy to Production
  # ---------------------------------------------------------
  deploy:
    name: Deploy Services via Docker Compose
    runs-on: ubuntu-latest
    timeout-hours: 2
    needs: build-and-push
    environment: production

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 📡 Notify Slack/Teams of deployment
        if: always()
        run: |
          echo "🚀 Deployment started for ECG Arrhythmia Classification Studio"
          echo "Backend: ${{ needs.build-and-push.outputs.backend-image }}"
          echo "Frontend: ${{ needs.build-and-push.outputs.frontend-image }}"

      - name: ⏳ Wait for image propagation
        run: |
          echo "Waiting 60 seconds for Docker images to propagate across registries..."
          sleep 60

      - name: 🚀 Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up --build -d

      - name: 🏥 Verify deployment health
        run: |
          echo "=== Verifying Backend Health ==="
          BACKEND_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health)
          if [ "$BACKEND_HEALTH" = "200" ]; then
            echo "✅ Backend is healthy (HTTP 200)"
          else
            echo "❌ Backend health check failed (HTTP $BACKEND_HEALTH)"
            exit 1
          fi

          echo "=== Verifying Frontend Health ==="
          FRONTEND_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          if [ "$FRONTEND_HEALTH" = "200" ]; then
            echo "✅ Frontend is healthy (HTTP 200)"
          else
            echo "❌ Frontend health check failed (HTTP $FRONTEND_HEALTH)"
            exit 1
          fi

      - name: 📊 Capture deployment metadata
        run: |
          echo "Deployment completed at: $(date -u)" >> deployment-metadata.txt
          echo "Backend image: ${{ needs.build-and-push.outputs.backend-image }}" >> deployment-metadata.txt
          echo "Frontend image: ${{ needs.build-and-push.outputs.frontend-image }}" >> deployment-metadata.txt
          echo "Git SHA: ${{ github.sha }}" >> deployment-metadata.txt

      - name: 📤 Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata-${{ github.sha }}
          path: deployment-metadata.txt
          retention-days: 90

  # ---------------------------------------------------------
  # Step 3: Security Hardening Post-Deploy
  # ---------------------------------------------------------
  post-deploy-security:
    name: Post-Deploy Security Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy
    if: success()

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Run OWASP ZAP security scan on deployed services
        run: |
          # Install OWASP ZAP
          sudo apt-get update && sudo apt-get install -y zaproxy
          
          # Scan backend API
          echo "Scanning backend at http://localhost:8000/api/v1..."
          zap-baseline.py -t http://localhost:8000/api/v1/health -r zap-backend-report.html || echo "ZAP scan completed (non-critical findings only)"
          
          # Scan frontend
          echo "Scanning frontend at http://localhost:3000..."
          zap-baseline.py -t http://localhost:3000 -r zap-frontend-report.html || echo "ZAP frontend scan completed"
          
          # Upload reports as artifacts
          echo "Security scan reports generated"

      - name: 📋 Check container security settings
        run: |
          # Verify non-root user execution
          echo "=== Backend Container User ==="
          docker inspect ecg-backend --format='{{.User}}' || echo "Container not running"
          echo "=== Frontend Container User ==="
          docker inspect ecg-frontend --format='{{.User}}' || echo "Container not running"

      - name: 📤 Upload security scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-security-${{ github.sha }}
          path: |
            zap-backend-report.html
            zap-frontend-report.html
          retention-days: 30